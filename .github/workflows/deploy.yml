name: CI/CD PHP Deploy VP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands for PHP Docker app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 20m
          script: |
            echo "🔌 Conexión exitosa al servidor..."

            cd ${{ secrets.WORK_DIR }}

            echo "📥 Actualizando código desde Git..."
            git fetch origin master
            git checkout master
            git pull origin master

            echo "🌐 Verificando redes Docker requeridas..."
            docker network create inmobiliaria_net 2>/dev/null || true
            docker network create inmobiliaria_proxy 2>/dev/null || true

            echo "🚀 Reconstruyendo solo los servicios de aplicación (App y Worker)..."
            docker compose up -d --build app_inmobiliaria worker_inmobiliaria

            echo "🧹 Limpiando imágenes obsoletas..."
            docker image prune -f

            echo "✅ ¡Despliegue completado con éxito en $HOSTNAME!"